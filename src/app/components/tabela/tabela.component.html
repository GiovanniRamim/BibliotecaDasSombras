<div class="tabela-container">
  <p *ngIf="carregando" class="status">Carregando dados...</p>

  <p *ngIf="erro" class="status erro">{{ erro }}</p>

  <div *ngIf="dados && !carregando && !erro" class="tabela-wrapper">
    <table *ngIf="dados.colunas.length > 0; else vazio">
      <thead>
        <tr>
          <th *ngFor="let coluna of dados.colunas">{{ coluna }}</th>
        </tr>
        <tr class="linha-filtro">
          <th *ngFor="let coluna of dados.colunas">
            <input
              type="text"
              class="filtro"
              placeholder="Filtrar..."
              [value]="filtros[coluna] ?? ''"
              (input)="atualizarFiltro(coluna, $any($event.target).value)"
              [attr.aria-label]="'Filtrar ' + coluna"
            />
          </th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let linha of linhasFiltradas">
          <td *ngFor="let coluna of dados.colunas">{{ linha[coluna] }}</td>
        </tr>
        <tr *ngIf="linhasFiltradas.length === 0">
          <td [attr.colspan]="dados.colunas.length" class="status">
            Nenhum resultado encontrado.
            <button type="button" class="limpar" (click)="limparFiltros()">Limpar filtros</button>
          </td>
        </tr>
      </tbody>
    </table>

    <ng-template #vazio>
      <p class="status">A planilha não possui dados.</p>
    </ng-template>
  </div>
</div>
